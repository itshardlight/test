<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:h="http://xmlns.jcp.org/jsf/html"
      xmlns:p="http://primefaces.org/ui"
      xmlns:f="http://xmlns.jcp.org/jsf/core">

    <h:head>
        <title>Registration</title>
    </h:head>

    <h:body>

        <h:form>
            <p:inputText value="#{userBean.UName}" placeholder="Enter your Username" required="true"  requiredMessage="Username is required" ></p:inputText>
            <br/>
            <p:password value="#{userBean.UPass}" placeholder="Enter Password" required="true" requiredMessage="Password is required"></p:password>
            <br/>
            <p:password value="#{userBean.CPass}" placeholder="Confirm Password" required="true" requiredMessage="Confirm Password is required"></p:password>
            <br/>
            <p:selectOneMenu value="#{userBean.URole}" required="true" requiredMessage="Role Must Be Selected">
                <f:selectItem itemLabel="-- Select Role --" itemValue="" />
                <f:selectItem itemLabel="Admin" itemValue="ADMIN" />
                <f:selectItem itemLabel="User" itemValue="USER" />
                <f:selectItem itemLabel="Manager" itemValue="MANAGER" />
            </p:selectOneMenu>
            <br/>
            <p:link value="Already Have an Account?" outcome="login.xhtml" />
            <br/>
            <p:commandButton value="Submit" action="#{userBean.register()}" process="@form" update="@form"></p:commandButton>
            <p:messages></p:messages>
        </h:form>

    </h:body>

</html>
