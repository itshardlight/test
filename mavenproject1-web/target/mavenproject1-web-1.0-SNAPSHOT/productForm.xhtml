<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:h="http://xmlns.jcp.org/jsf/html"
      xmlns:p="http://primefaces.org/ui">

    <h:head>
        <title>Product Form</title>
    </h:head>

    <h:body>
        <h:form>
            <p:growl id="growl" showDetail="true" />

            <p:inputText value="#{productBean.entity.productName}" required="true" requiredMessage="Field Cannot Be Empty"
                         placeholder="Enter Product Name" />
            <p:inputText value="#{productBean.entity.productCode}" required="true" requiredMessage="Field Cannot Be Empty"
                         placeholder="Enter Product Code" />

            <p:inputText value="#{productBean.entity.supplierId}" required="true" requiredMessage="Field Cannot Be Empty"
                         placeholder="Enter Supplier ID" />

            <p:inputText value="#{productBean.entity.costPrice}" required="true" requiredMessage="Field Cannot Be Empty"
                         placeholder="Enter Cost Price" />

            <p:inputText value="#{productBean.entity.sellingPrice}" required="true" requiredMessage="Field Cannot Be Empty"
                         placeholder="Enter Selling Price" />

            <p:inputText value="#{productBean.entity.stockQuantity}" required="true" requiredMessage="Field Cannot Be Empty"
                         placeholder="Enter Stock Quantity" />

            <p:selectBooleanCheckbox value="#{productBean.entity.vatApplicable}" />
            <h:outputLabel value="VAT Applicable" />

            <p:inputText value="#{productBean.entity.category}"
                         placeholder="Enter Category" />

            <p:commandButton action="#{productBean.save()}" value="Submit" update="growl"></p:commandButton>
        </h:form>

    </h:body>

</html>
