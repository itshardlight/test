<ui:composition
    template="/WEB-INF/template.xhtml"
    xmlns="http://www.w3.org/1999/xhtml"
    xmlns:h="http://xmlns.jcp.org/jsf/html"
    xmlns:p="http://primefaces.org/ui"
    xmlns:ui="http://xmlns.jcp.org/jsf/facelets">

    <ui:define name="title">
        View Supplier 
    </ui:define>

    <ui:define name="content">


        <p:commandButton value="Back" icon="pi pi-arrow-left" type="button" onclick="history.back();" />
        <h:form>
            <div class="card">
                <p:dataTable var="supplier" value="#{supplierBean.show()}">

                    <p:column headerText="Supplier Code">
                        <h:outputText value="#{supplier.id}"/>
                    </p:column>

                    <p:column headerText="Supplier Name">
                        <h:outputText value="#{supplier.sname}" />
                    </p:column>



                    <p:column headerText="Action">
                        <p:commandButton value="Delete" action="#{supplierBean.remove(supplier)}" update="@form">
                            <p:confirm  header="Delete Supplier"
                                        message="Are you sure you want to delete #{supplier.sname}?"
                                        icon="pi pi-info-circle"/></p:commandButton>
                    </p:column>


                </p:dataTable>
            </div>
        </h:form>
        <ui:include src="/WEB-INF/confirmDialog.xhtml"/>
    </ui:define>

</ui:composition>
