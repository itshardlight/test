<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:h="http://xmlns.jcp.org/jsf/html"
      xmlns:p="http://primefaces.org/ui">

    <h:head>
        <title>SupplierDisplay</title>
    </h:head>

    <h:body>
<p:commandButton value="Back" icon="pi pi-arrow-left" type="button" onclick="history.back();" />
        <h:form>
            <div class="card">
                <p:dataTable var="supplier" value="#{supplierBean.show()}">

                    <p:column headerText="Supplier Code">
                        <h:outputText value="#{supplier.id}"/>
                    </p:column>

                    <p:column headerText="Supplier Name">
                        <h:outputText value="#{supplier.sname}" />
                    </p:column>

                   

                    <p:column headerText="Action">
                        <p:commandButton value="Delete" action="#{supplierBean.remove(supplier)}" update="@form"></p:commandButton>
                    </p:column>


                </p:dataTable>
            </div>
        </h:form>

    </h:body>

</html>
