<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:h="http://xmlns.jcp.org/jsf/html"
      xmlns:p="http://primefaces.org/ui">

    <h:head>
        <title>PrimeFaces Test</title>
    </h:head>

    <h:body>
        <h:form>
            <p:dataTable value="#{testBean.listEntity}" id="dataTable" var="row">

            <p:column headerText="Name">
                <p:inputText id="inputName" value="#{row.name}"></p:inputText>
            </p:column>
            <p:column>
                <p:commandButton value="Remove" action="#{testBean.removeRow(row)}" update="dataTable"></p:commandButton>
            </p:column>
        </p:dataTable>
            <p:commandButton value="Add Row" action="#{testBean.addRow()}" update="dataTable"></p:commandButton><br/>
            <p:commandButton value="Save" action="#{testBean.saveAllrows()}" update="dataTable"></p:commandButton>

        <br/><br/><br/><br/>
        </h:form>
        

    </h:body>

</html>
