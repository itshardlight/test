<?xml version="1.0" encoding="UTF-8"?>
<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:h="http://xmlns.jcp.org/jsf/html"
      xmlns:p="http://primefaces.org/ui"
      xmlns:f="http://xmlns.jcp.org/jsf/core">

    <h:head>
        <title>PrimeFaces Test</title>
    </h:head>

    <h:body>

        <h:form id="salesForm">

            <p:selectOneMenu id="product"
                             value="#{salesBean.entity2.productId}"
                             filter="true"
                             filterMatchMode="contains">

                <f:selectItem itemLabel="Select Product"
                              itemValue="#{null}"
                              noSelectionOption="true" />

                <f:selectItems value="#{productBean.show()}"
                               var="product"
                               itemLabel="#{product.id} - #{product.productName}"
                               itemValue="#{product.id}" />

                <p:ajax event="change"
                        listener="#{salesBean.productChanged}"
                        update="productTable product" />

            </p:selectOneMenu>

            <p:dataTable id="productTable"
                         value="#{salesBean.item}"
                         var="product"
                         style="margin-top:20px">

                <p:column headerText="Product Name">
                    <h:outputText value="#{product.id}" />
                </p:column>
                
                 <p:column headerText="Selling Price">
                     <h:outputText value="#{product.sellingPrice}" />
                </p:column>

            </p:dataTable>

        </h:form>

    </h:body>

</html>
