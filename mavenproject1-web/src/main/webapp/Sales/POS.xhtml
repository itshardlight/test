<?xml version="1.0" encoding="UTF-8"?>
<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:h="http://xmlns.jcp.org/jsf/html"
      xmlns:p="http://primefaces.org/ui"
      xmlns:f="http://xmlns.jcp.org/jsf/core"
      xmlns:ui="http://xmlns.jcp.org/jsf/facelets">

    <h:head>
        <title>PrimeFaces Test</title>
    </h:head>
    <h:body>
        <p:commandButton value="Back" icon="pi pi-arrow-left" type="button" onclick="history.back();" />
        <ui:include src="/WEB-INF/confirmDialog.xhtml"/>
        <h:form id="form">
            <p:datePicker id="date"
                          value="#{salesBean.entity1.sdate}"
                          pattern="yyyy-MM-dd" 
                          showIcon="true"
                          showButtonBar="true"
                          inputStyle="width: 150px;"
                          /><br/>
            <p:growl id="growl" showDetail="true" />
            <p:selectOneMenu
                id="product"
                value="#{salesBean.selectedProduct}">

                <f:selectItem
                    itemLabel="-- Select Category --"
                    itemValue="" />

                <f:selectItems
                    value="#{stockBean.showAll()}"
                    var="product"
                    itemLabel="#{product[0]} - #{productBean.dao.findById(product[0])}"
                    itemValue="#{product[0]}" />

                <p:ajax
                    event="change"
                    update="stockDialog dataTable"
                    oncomplete="PF('stockDialog').show();" 
                    />

            </p:selectOneMenu>


            <p:dialog
                id="stockDialog"
                widgetVar="stockDialog"
                header="Stock Details"
                modal="true"
                width="700"
                resizable="false">

                <p:dataTable
                    id="dataTable"
                    value="#{stockBean.show(salesBean.selectedProduct)}"
                    var="row"
                    selectionMode="single" 
                    rowKey="#{row.id}"
                    >

                    <p:ajax event="rowSelect" 
                            update="form:product cartForm:cartTable form:growl"
                            listener="#{salesBean.onRowSelect}" 
                            oncomplete="PF('stockDialog').hide();"
                            />
                    <p:column headerText="ID">
                        <h:outputText value="#{row.id}" />
                    </p:column>
                    <p:column headerText="ProductName">
                        <h:outputText value="#{productBean.dao.findById(salesBean.selectedProduct)}" />
                    </p:column>

                    <p:column headerText="Cost Price">
                        <h:outputText value="#{row.costPrice}" />
                    </p:column>

                    <p:column headerText="Selling Price">
                        <h:outputText value="#{row.sellingPrice}" />
                    </p:column>

                    <p:column headerText="Stock Remaining">
                        <h:outputText value="#{row.quantity}" />
                    </p:column>



                </p:dataTable>

            </p:dialog>



        </h:form>

        <h:form id="cartForm">
            <p:dataTable id="cartTable"
                         value="#{salesBean.cart}"
                         var="row2"
                         rowKey="#{row2.id}">
                <p:column headerText="Product">
                    <h:outputText value="#{row2.productId.productName}" />
                </p:column>
                <p:column headerText="Selling Price">
                    <h:outputText value="#{row2.sellingPrice}" />
                </p:column>
                <p:column headerText="Quantity">
                    <h:outputText value="#{row2.soldQuantity}" />
                </p:column>
                <p:column headerText="Action">
                    <p:commandButton value="Remove"
                                     action="#{salesBean.removeFromCart(row2)}"
                                     update="cartTable form:growl"
                                     process="@this">
                        <p:confirm  header="Delete Category"
                                    message="Are you sure you want to delete this category?"
                                    icon="pi pi-exclamation-triangle"/>


                    </p:commandButton>
                </p:column>
            </p:dataTable>

        </h:form>
    </h:body>

</html>
