<?xml version="1.0" encoding="UTF-8"?>
<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:h="http://xmlns.jcp.org/jsf/html"
      xmlns:p="http://primefaces.org/ui"
      xmlns:f="http://xmlns.jcp.org/jsf/core">

    <h:head>
        <title>PrimeFaces Test</title>
    </h:head>

    <h:body>

        <h:form>

            <p:selectOneMenu id="product"
                             value="#{salesBean.productid}"
                             filter="true"
                             filterMatchMode="contains">

                <f:selectItem itemLabel="Select Product"
                              itemValue="#{null}"
                              noSelectionOption="true" />

                <f:selectItems
                    value="#{stockBean.displayStock()}"
                    var="product"
                    itemLabel="#{product[0]} - #{productBean.dao.findById(product[0])}"
                    itemValue="#{product[0]}" />

                <p:ajax event="change"
                        listener="#{salesBean.onchange()}"
                        update="" />

            </p:selectOneMenu>

     

        </h:form>

    </h:body>

</html>
