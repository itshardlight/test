<ui:composition
    template="/WEB-INF/template.xhtml"
    xmlns="http://www.w3.org/1999/xhtml"
    xmlns:h="http://xmlns.jcp.org/jsf/html"
    xmlns:p="http://primefaces.org/ui"
    xmlns:ui="http://xmlns.jcp.org/jsf/facelets">

    <ui:define name="title">
        View Category
    </ui:define>

    <ui:define name="content">


        <p:commandButton value="Back" icon="pi pi-arrow-left" type="button" onclick="history.back();" />
        <h:form>
            <div class="card">
                <p:dataTable var="entity" value="#{categoryBean.show()}"
                             paginator="true"
                             rows="7"
                             paginatorPosition="bottom">

                    <p:column headerText="Category Code" 
                              filterBy="#{entity.cname}" 
                          filterMatchMode="contains">
                        <h:outputText value="#{entity.id}"/>
                    </p:column>

                    <p:column headerText="Category Name">
                        <h:outputText value="#{entity.cname}" />
                    </p:column>



                    <p:column headerText="Action">
                        <p:commandButton value="Delete" action="#{categoryBean.remove(entity)}" update="@form">
                            <p:confirm 
                                header="Delete Category"
                                message="Are you sure you want to delete #{entity.cname}?"
                                icon="pi pi-exclamation-triangle"/></p:commandButton>
                    </p:column>


                </p:dataTable>
            </div>
        </h:form>
        <ui:include src="/WEB-INF/confirmDialog.xhtml"/>
    </ui:define>

</ui:composition>
