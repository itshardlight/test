<ui:composition
    template="/WEB-INF/template.xhtml"
    xmlns="http://www.w3.org/1999/xhtml"
    xmlns:h="http://xmlns.jcp.org/jsf/html"
    xmlns:p="http://primefaces.org/ui"
    xmlns:ui="http://xmlns.jcp.org/jsf/facelets">

    <ui:define name="title">
        Add Category
    </ui:define>

    <ui:define name="content">


        <p:growl id="growl" showDetail="true" />
        <p:commandButton value="Back" icon="pi pi-arrow-left" type="button" onclick="history.back();" />
        <h:form>
            <p:inputText placeholder="Enter Category" value="#{categoryBean.entity.cname}" required="true" requiredMessage="Field Cannot be Empty"/>
            <br/>
            <p:commandButton value="Submit" action="#{categoryBean.save()}" update="growl" />

        </h:form>

    </ui:define>

</ui:composition>
