<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
xmlns:h="http://xmlns.jcp.org/jsf/html"
xmlns:p="http://primefaces.org/ui"
xmlns:ui="http://xmlns.jcp.org/jsf/facelets">


    <h:head>

        <title>
            <ui:insert name="title">
                My Application
            </ui:insert>
        </title>

        <style>
            .layout {
                display: flex;
                min-height: 100vh;
            }

            .sidebar {
                width: 180px;
                padding: 20px;
                border-right: 1px solid #ddd;
            }

            .content {
                flex: 1;
                padding: 30px;
            }

            .nav-item {
                display: block;
                margin-bottom: 15px;
            }
        </style>

    </h:head>

    <h:body>

        <div class="layout">

            <!-- LEFT SIDE -->
            <div class="sidebar">

                <h2>Navigation</h2>

                 <p:link value="Home"
                        outcome="/home.xhtml"
                        styleClass="nav-item" />

                <p:link value="Add Product"
                        outcome="/Product/productForm.xhtml"
                        styleClass="nav-item" />

                <p:link value="View Product"
                        outcome="/Product/productDisplay.xhtml"
                        styleClass="nav-item" />

                <p:link value="Add Supplier"
                        outcome="/Supplier/supplierForm.xhtml"
                        styleClass="nav-item" />

                <p:link value="View Supplier"
                        outcome="/Supplier/supplierDisplay.xhtml"
                        styleClass="nav-item" />

                <p:link value="Add Category"
                        outcome="/Category/categoryForm.xhtml"
                        styleClass="nav-item" />

                <p:link value="View Category"
                        outcome="/Category/categoryDisplay.xhtml"
                        styleClass="nav-item" />

                <p:link value="Make Purchase"
                        outcome="/Purchase/purchaseForm.xhtml"
                        styleClass="nav-item" />

                <p:link value="Check Purchase"
                        outcome="/Purchase/purchaseDetail.xhtml"
                        styleClass="nav-item" />

            </div>

            <!-- RIGHT SIDE -->
            <div class="content">

                <ui:insert name="content">
                    Page content goes here
                </ui:insert>

            </div>

        </div>

    </h:body>

</html>
