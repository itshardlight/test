<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:h="http://xmlns.jcp.org/jsf/html"
      xmlns:p="http://primefaces.org/ui">

    <h:head>
        <title>PrimeFaces Test</title>
    </h:head>

    <h:body>

        <p:commandButton value="Back"
                         icon="pi pi-arrow-left"
                         type="button"
                         onclick="history.back();" />

        <h:form id="form">

            <p:dataTable id="stockTable"
                         value="#{stockBean.displayStock()}"
                         var="stock"
                         rowKey="#{stock[0]}"
                         selectionMode="single"
                         selection="#{stockBean.selectedStock}"
                         paginator="true"
                         rows="7"
                         paginatorPosition="bottom">

                <p:ajax event="rowSelect"
                        listener="#{stockBean.onRowSelect}"
                        process="@this" />

                <p:column headerText="Product ID"
                           filterBy="#{productBean.dao.findById(stock[0])}"
                          filterMatchMode="contains">
                    
                    <h:outputText value="#{stock[0]}" />
                </p:column>

                <p:column headerText="Name"
                         >

                    <h:outputText value="#{productBean.dao.findById(stock[0])}" />

                </p:column>

                <p:column headerText="Current Stock">
                    <h:outputText value="#{stock[1]}" />
                </p:column>

            </p:dataTable>

        </h:form>

    </h:body>

</html>
