<ui:composition
    template="/WEB-INF/template.xhtml"
    xmlns="http://www.w3.org/1999/xhtml"
    xmlns:h="http://xmlns.jcp.org/jsf/html"
    xmlns:p="http://primefaces.org/ui"
    xmlns:ui="http://xmlns.jcp.org/jsf/facelets">

    <ui:define name="title">
        Stock
    </ui:define>

    <ui:define name="content">

        <p:commandButton value="Back"
                         icon="pi pi-arrow-left"
                         type="button"
                         onclick="history.back();" />

        <h:form id="form">

            <p:dataTable id="stockTable"
                         value="#{stockBean.displayStock()}"
                         var="stock"
                         rowKey="#{stock.productId}"
                         selectionMode="single"
                         selection="#{stockBean.selectedStock}"
                         paginator="true"
                         rows="7"
                         paginatorPosition="bottom">

                <p:ajax event="rowSelect"
                        listener="#{stockBean.onRowSelect}"
                        process="@this" />

                <p:column headerText="Product ID"
                          filterBy="#{stock.productId}"
                          filterMatchMode="contains">

                    <h:outputText value="#{stock.productId}" />

                </p:column>

                <p:column headerText="Name">

                    <h:outputText
                        value="#{productBean.dao.findById(stock.productId)}" />

                </p:column>

                <p:column headerText="Current Stock">

                    <h:outputText value="#{stock.quantity}" />

                </p:column>

            </p:dataTable>

        </h:form>

    </ui:define>

</ui:composition>
