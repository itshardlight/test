<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:h="http://xmlns.jcp.org/jsf/html"
      xmlns:p="http://primefaces.org/ui">

    <h:head>
        <title>PrimeFaces Test</title>
    </h:head>

    <h:body>
        <p:commandButton value="Back" icon="pi pi-arrow-left" type="button" onclick="history.back();" />
        <h:form>
            <h:form>


                <p:dataTable id="stockTable"
                             value="#{stockBean.displayStock()}"
                             var="stock">

                    <p:column headerText="Product ID">
                        <h:outputText value="#{productBean.dao.findById(stock[0])}"/>
                    </p:column>

                    <p:column headerText="Current Stock">
                        <h:outputText value="#{stock[1]}"/>
                    </p:column>

                </p:dataTable>

            </h:form>

        </h:form>

    </h:body>

</html>
