<ui:composition
    template="/WEB-INF/template.xhtml"
    xmlns="http://www.w3.org/1999/xhtml"
    xmlns:h="http://xmlns.jcp.org/jsf/html"
    xmlns:p="http://primefaces.org/ui"
    xmlns:ui="http://xmlns.jcp.org/jsf/facelets">

    <ui:define name="title">
        Stock Detail
    </ui:define>

    <ui:define name="content">

        <p:commandButton value="Back"
                         icon="pi pi-arrow-left"
                         type="button"
                         onclick="history.back();" />

        <h:form>

            <p:dataTable id="dataTable"
                         value="#{stockBean.show(stockBean.urlId)}"
                         var="row">
                <p:column headerText="ID">
                    <h:outputText value="#{productBean.dao.findById(stockBean.urlId)}" />
                </p:column>
                <p:column headerText="Cost Price">
                    <h:outputText value="#{row.costPrice}" />
                </p:column>
                <p:column headerText="Selling Price">
                    <h:outputText value="#{row.sellingPrice}" />
                </p:column>
                <p:column headerText="Stock Remaining">
                    <h:outputText value="#{row.quantity}" />
                </p:column>
            </p:dataTable>


        </h:form>

    </ui:define>

</ui:composition>
