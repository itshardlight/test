<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:h="http://xmlns.jcp.org/jsf/html"
      xmlns:p="http://primefaces.org/ui">

    <h:head>
        <title>PrimeFaces Test</title>
    </h:head>

    <h:body>

        <p:commandButton value="Back"
                         icon="pi pi-arrow-left"
                         type="button"
                         onclick="history.back();" />

        <p:dataTable id="stockTable2"
                     value="#{stockBean.displayDetailStock(stockBean.urlId)}"
                     var="stock"
                     paginator="true"
                     rows="7"
                     paginatorPosition="bottom"
                     >

            <p:column headerText="Product Name">
                <h:outputText value="#{productBean.dao.findById(stock[0])}" />
            </p:column>

            <p:column headerText="CP">
                <h:outputText value="#{stock[1]}" />
            </p:column>

            <p:column headerText="SP">
                <h:outputText value="#{stock[2]}" />
            </p:column>

            <p:column headerText="Current Stock">
                <h:outputText value="#{stock[3]}" />
            </p:column>

        </p:dataTable>

    </h:body>

</html>
