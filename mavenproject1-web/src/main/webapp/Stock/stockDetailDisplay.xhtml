<ui:composition
    template="/WEB-INF/template.xhtml"
    xmlns="http://www.w3.org/1999/xhtml"
    xmlns:h="http://xmlns.jcp.org/jsf/html"
    xmlns:p="http://primefaces.org/ui"
    xmlns:ui="http://xmlns.jcp.org/jsf/facelets">

    <ui:define name="title">
        Stock Detail
    </ui:define>

    <ui:define name="content">

        <p:commandButton value="Back"
                         icon="pi pi-arrow-left"
                         type="button"
                         onclick="history.back();" />

        <h:form>

            <p:dataTable id="stockTable2"
                         value="#{stockBean.displayDetailStock(stockBean.urlId)}"
                         var="stock"
                         paginator="true"
                         rows="7"
                         paginatorPosition="bottom">

                <p:column headerText="Product Name">

                    <h:outputText
                        value="#{productBean.dao.findById(stock.productId)}" />

                </p:column>

                <p:column headerText="CP">

                    <h:outputText value="#{stock.costPrice}" />

                </p:column>

                <p:column headerText="SP">

                    <h:outputText value="#{stock.sellingPrice}" />

                </p:column>

                <p:column headerText="Current Stock">

                    <h:outputText value="#{stock.quantity}" />

                </p:column>

            </p:dataTable>

        </h:form>

    </ui:define>

</ui:composition>
