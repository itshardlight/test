<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:h="http://xmlns.jcp.org/jsf/html"
      xmlns:p="http://primefaces.org/ui"
      xmlns:f="http://xmlns.jcp.org/jsf/core">

    <h:head>
        <title>Product Form</title>
    </h:head>

    <h:body>
        <p:growl id="growl" showDetail="true" />

        <p:commandButton value="Back" icon="pi pi-arrow-left" type="button" onclick="history.back();" />
        <h:form>

            <p:inputText value="#{productBean.entity.productName}" required="true" requiredMessage="Field Cannot Be Empty"
                         placeholder="Enter Product Name" /><br/>

            <p:selectOneMenu 
                value="#{productBean.entity.categoryId}" 
                required="true" 
                requiredMessage="Category Must Be Selected"
                filter="true"
                filterMatchMode="contains">

                <f:selectItem itemLabel="-- Select Category --" itemValue="" />

                <f:selectItems value="#{categoryBean.show()}"
                               var="category"
                               itemLabel="#{category.cname}"
                               itemValue="#{category.id}" />

            </p:selectOneMenu>
            <br/>


            <p:commandButton action="#{productBean.save()}" value="Submit" update="growl" ></p:commandButton>
        </h:form>

    </h:body>

</html>
