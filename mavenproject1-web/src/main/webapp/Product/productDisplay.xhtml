<ui:composition
    template="/WEB-INF/template.xhtml"
    xmlns="http://www.w3.org/1999/xhtml"
    xmlns:h="http://xmlns.jcp.org/jsf/html"
    xmlns:p="http://primefaces.org/ui"
    xmlns:ui="http://xmlns.jcp.org/jsf/facelets">

    <ui:define name="title">
        Product Display
    </ui:define>

    <ui:define name="content">

        <p:commandButton value="Back" icon="pi pi-arrow-left" type="button" onclick="history.back();" />

        <h:form>
            <div class="card">
                <p:dataTable var="product"
                             value="#{productBean.show()}"
                             paginator="true"
                             rows="7"
                             paginatorPosition="bottom">

                    <p:column headerText="Product Code" style="width: 10%">
                        <h:outputText value="#{product.id}"/>
                    </p:column>

                    <p:column headerText="Product Name">
                        <h:outputText value="#{product.productName}" />
                    </p:column>

                    <p:column headerText="Category">
                        <h:outputText value="#{categoryBean.getCategoryName(product.categoryId)}" />
                    </p:column>


                    <p:column headerText="Action">
                        <p:commandButton value="Delete" action="#{productBean.delProduct(product)}" update="@form"></p:commandButton>
                    </p:column>


                </p:dataTable>
            </div>
        </h:form>
       

    </ui:define>

</ui:composition>
