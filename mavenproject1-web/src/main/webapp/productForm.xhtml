<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:h="http://xmlns.jcp.org/jsf/html"
      xmlns:p="http://primefaces.org/ui"
      xmlns:f="http://xmlns.jcp.org/jsf/core">

    <h:head>
        <title>Product Form</title>
    </h:head>

    <h:body>
        <p:commandButton value="Back" icon="pi pi-arrow-left" type="button" onclick="history.back();" />

        <h:form>
            <p:growl id="growl" showDetail="true" />

            <p:inputText value="#{productBean.entity.productName}" required="true" requiredMessage="Field Cannot Be Empty"
                         placeholder="Enter Product Name" /><br/>
            <p:inputText value="#{productBean.entity.productCode}" required="true" requiredMessage="Field Cannot Be Empty"
                         placeholder="Enter Product Code" /><br/>

            <p:selectOneMenu value="#{productBean.entity.supplierId}" required="true" requiredMessage="Supplier Must Be Selected">
                <f:selectItem itemLabel="-- Select Supplier --" itemValue="" />
                <f:selectItems value="#{supplierBean.show()}"
                               var="supplier"
                               itemLabel="#{supplier.sname}"
                               itemValue="#{supplier.id}" />
            </p:selectOneMenu><br/>

            <p:inputText value="#{productBean.entity.costPrice}" required="true" requiredMessage="Field Cannot Be Empty"
                         placeholder="Enter Cost Price" /><br/>

            <p:inputText value="#{productBean.entity.sellingPrice}" required="true" requiredMessage="Field Cannot Be Empty"
                         placeholder="Enter Selling Price" /><br/>

            <p:inputText value="#{productBean.entity.stockQuantity}" required="true" requiredMessage="Field Cannot Be Empty"
                         placeholder="Enter Stock Quantity" /><br/>

            <p:selectBooleanCheckbox value="#{productBean.entity.vatApplicable}" />
            <h:outputLabel value="VAT Applicable" /><br/>

            <p:inputText value="#{productBean.entity.category}"
                         placeholder="Enter Category" /><br/>

            <p:commandButton action="#{productBean.save()}" value="Submit" update="growl" ></p:commandButton>
        </h:form>

    </h:body>

</html>
