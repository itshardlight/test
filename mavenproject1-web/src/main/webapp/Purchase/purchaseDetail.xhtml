<ui:composition
    template="/WEB-INF/template.xhtml"
    xmlns="http://www.w3.org/1999/xhtml"
    xmlns:h="http://xmlns.jcp.org/jsf/html"
    xmlns:p="http://primefaces.org/ui"
    xmlns:ui="http://xmlns.jcp.org/jsf/facelets">

    <ui:define name="title">
        Purchase Detail
    </ui:define>

    <ui:define name="content">


        <p:commandButton value="Back" icon="pi pi-arrow-left" type="button" onclick="history.back();" />
        <h:form>
            <p:dataTable id="dataTable"
                         value="#{purchaseBean.dao.showPurchase()}"
                         var="item"
                         paginator="true"
                         rows="10"
                         paginatorPosition="bottom"
                         selection="#{purchaseBean.selectedPurchase}"
                         selectionMode="single" 
                         rowKey="#{item.id}">


                <p:ajax event="rowSelect"  listener="#{purchaseBean.onRowSelect}" 
                        />
                <p:column headerText="Purchase Id">
                    <h:outputText value="#{item.id}" />
                </p:column>

                <p:column headerText="Date">
                    <h:outputText value="#{item.date}" />
                </p:column>

                <p:column headerText="Supplier Name">
                    <h:outputText value="#{supplierBean.dao.getSupplierName(item.supplierId)}" />
                </p:column>

                <p:column headerText="Total Amount">
                    <h:outputText value="#{item.totalPrice}" />
                </p:column>

            </p:dataTable>

        </h:form>

    </ui:define>

</ui:composition>
