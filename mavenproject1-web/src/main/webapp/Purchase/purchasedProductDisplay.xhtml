<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:h="http://xmlns.jcp.org/jsf/html"
      xmlns:p="http://primefaces.org/ui">

    <h:head>
        <title>PrimeFaces Test</title>
    </h:head>

    <h:body>
        <p:commandButton value="Back" icon="pi pi-arrow-left" type="button" onclick="history.back();" />
        <h:form>
            <h:outputText value="Purchase ID: #{purchaseBean.urlId}" /><br/>
            <h:outputText value="Supplier: #{purchaseBean.supplierName}" /><br/>        
            <h:outputText value="Total Amount: Rs #{purchaseBean.totalAmt}" /><br/>



            <p:dataTable id="dataTable"
                         value="#{purchaseBean.purchaseDetails}"
                         var="item">

                <p:column headerText="Product Id">
                    <h:outputText value="#{productBean.dao.findById(item.productId)}" />
                </p:column>

                <p:column headerText="Cost Price">
                    <h:outputText value="#{item.costPrice}" />
                </p:column>

                <p:column headerText="Selling Price">
                    <h:outputText value="#{item.sellingPrice}" />
                </p:column>
                <p:column headerText="Quantity">
                    <h:outputText value="#{item.stockQuantity}" />
                </p:column>

            </p:dataTable>

        </h:form>

    </h:body>

</html>
