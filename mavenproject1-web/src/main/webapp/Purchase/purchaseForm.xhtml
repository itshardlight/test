<ui:composition
    template="/WEB-INF/template.xhtml"
    xmlns="http://www.w3.org/1999/xhtml"
    xmlns:h="http://xmlns.jcp.org/jsf/html"
    xmlns:p="http://primefaces.org/ui"
    xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
    xmlns:f="http://xmlns.jcp.org/jsf/core">

    <ui:define name="title">
        Make Purchase
    </ui:define>

    <ui:define name="content">


        <p:growl id="growl" showDetail="true" />

        <p:commandButton value="Back" icon="pi pi-arrow-left" type="button" onclick="history.back();" />
        <h:form id="purchaseForm">
            <p:datePicker id="date"
                          value="#{purchaseBean.entity1.date}"
                          pattern="yyyy-MM-dd" 
                          showIcon="true"
                          showButtonBar="true"
                          inputStyle="width: 150px;"
                          /><br/>
            <p:selectOneMenu value="#{purchaseBean.entity1.supplierId}" required="true"
                             requiredMessage="Supplier Must Be Selected" 
                             filter="true"
                             filterMatchMode="contains">
                <f:selectItem itemLabel="-- Select Supplier --" itemValue="" />
                <f:selectItems value="#{supplierBean.show()}"
                               var="supplier"
                               itemLabel="#{supplier.sname}"
                               itemValue="#{supplier.id}" />
            </p:selectOneMenu>
            <p:dataTable id="itemTable" value="#{purchaseBean.items2}" var="item">

                <p:column headerText="Product" style="width: 25%">
                    <p:selectOneMenu value="#{item.productId}"
                                     required="true"
                                     requiredMessage="Product Must Be Selected"
                                     filter="true"
                                     filterMatchMode="contains">
                        <f:selectItem itemLabel="-- Select Product --" itemValue="" />
                        <f:selectItems value="#{productBean.show()}"
                                       var="product"
                                       itemLabel="#{product.productName}"
                                       itemValue="#{product.id}" />
                    </p:selectOneMenu>
                </p:column>

                <p:column headerText="Cost Price">
                    <p:inputText value="#{item.costPrice}"
                                 placeholder="Enter Cost Price"
                                 required="true"
                                 requiredMessage="Field Cannot be Empty">
                        <p:ajax event="change"
                                listener="#{purchaseBean.calculateTotal}"
                                update=":purchaseForm:totalPanel"/>
                    </p:inputText>
                </p:column>

                <p:column headerText="Selling Price">
                    <p:inputText value="#{item.sellingPrice}"
                                 placeholder="Enter Selling Price"
                                 required="true"
                                 requiredMessage="Field Cannot be Empty"/>
                </p:column>

                <p:column headerText="Stock">
                    <p:inputText value="#{item.stockQuantity}"
                                 placeholder="Enter Stock"
                                 required="true"
                                 requiredMessage="Field Cannot be Empty">
                        <p:ajax event="change"
                                listener="#{purchaseBean.calculateTotal}"
                                update=":purchaseForm:totalPanel"/></p:inputText>
                </p:column>
                <p:column>
                    <p:commandButton value="Remove" immediate="true"
                                     action="#{purchaseBean.removeRow(item)}"
                                     update="itemTable"/><br/>
                </p:column>

            </p:dataTable>
            <h:panelGroup id="totalPanel">

                Total:
                <h:outputText value="#{purchaseBean.entity1.totalPrice}" />

            </h:panelGroup><br/>
            <p:commandButton value="Add" 
                             action="#{purchaseBean.addRow}"
                             update="itemTable"/><br/>

            <p:commandButton value="Submit" action="#{purchaseBean.save}" update="growl"></p:commandButton>
        </h:form>

    </ui:define>

</ui:composition>
