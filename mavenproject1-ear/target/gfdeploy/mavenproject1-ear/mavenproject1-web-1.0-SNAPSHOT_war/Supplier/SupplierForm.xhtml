<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:h="http://xmlns.jcp.org/jsf/html"
      xmlns:p="http://primefaces.org/ui">

    <h:head>
        <title>Supplier Form</title>
    </h:head>

    <h:body>
        <p:growl id="growl" showDetail="true" />
        <p:commandButton value="Back" icon="pi pi-arrow-left" type="button" onclick="history.back();"/>
        <h:form>

            <p:inputText placeholder="Enter Supplier Name" value="#{supplierBean.entity.sname}" required="true" requiredMessage="Field Cannot Be Empty" />

            <br/><br/>

            <p:commandButton value="Submit" action="#{supplierBean.add()}" update="@form growl"/>

        </h:form>

    </h:body>

</html>
