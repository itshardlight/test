<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:h="http://xmlns.jcp.org/jsf/html"
      xmlns:p="http://primefaces.org/ui">

    <h:head>
        <title>SupplierForm</title>
    </h:head>

    <h:body>
<p:commandButton value="Back" icon="pi pi-arrow-left" type="button" onclick="history.back();"/>
        <h:form>

            <p:inputText placeholder="Enter your name" value="#{supplierBean.entity.sname}" />

            <br/><br/>

            <p:commandButton value="Submit" action="#{supplierBean.add()}" update="@form"/>

        </h:form>

    </h:body>

</html>
