<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:h="http://xmlns.jcp.org/jsf/html"
      xmlns:p="http://primefaces.org/ui">

    <h:head>
        <title>Poduct Stock</title>
    </h:head>

    <h:body>
        <p:commandButton value="Back" icon="pi pi-arrow-left" type="button" onclick="history.back();" />

        <h:form>
            <div class="card">
                <p:dataTable var="product" value="#{productBean.show()}">

                    <p:column headerText="Product Code">
                        <h:outputText value="#{product.productCode}"/>
                    </p:column>

                    <p:column headerText="Product Name">
                        <h:outputText value="#{product.productName}" />
                    </p:column>

                    <p:column headerText="Category">
                        <h:outputText value="#{product.categoryId}" />
                    </p:column>

                    <p:column headerText="Supplier ID">
                        <h:outputText value="#{product.supplierId}" />
                    </p:column>

                    <p:column headerText="Cost Price">
                        <h:outputText value="#{product.costPrice}" />
                    </p:column>

                    <p:column headerText="Selling Price">
                        <h:outputText value="#{product.sellingPrice}" />
                    </p:column>

                    <p:column headerText="Stock Quantity">
                        <h:outputText value="#{product.stockQuantity}" />
                    </p:column>

                    <p:column headerText="VAT Applicable">
                        <h:outputText value="#{product.vatApplicable}" />
                    </p:column>

                    <p:column headerText="Action">
                        <p:commandButton value="Delete" action="#{productBean.delProduct(product)}" update="@form"></p:commandButton>
                    </p:column>


                </p:dataTable>
            </div>
        </h:form>
    </h:body>

</html>
